[workspace]
members = [".", "demos/tui-demo", "demos/role-play"]
resolver = "2"

[workspace.dependencies]
# SDK - workspace members use this; path for dev, version for publish
anthropic-agent-sdk = { version = "0.3.0", path = "." }

[package]
name = "anthropic-agent-sdk"
version = "0.3.0"
edition = "2024"
authors = ["Angel Bartolli <bartolli@gmail.com>"]
description = "Rust SDK for Claude Code CLI - streaming queries, hooks, permissions, and MCP integration"
license = "MIT"
repository = "https://github.com/bartolli/anthropic-agent-sdk"
keywords = ["claude", "ai", "sdk", "anthropic", "agent"]
categories = ["api-bindings", "asynchronous"]
rust-version = "1.85.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
# Async runtime
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["codec", "rt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Official Anthropic MCP SDK (optional - for SDK MCP servers)
rmcp = { version = "0.12.0", optional = true, features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-worker", "macros"] }

# Error handling
thiserror = "2.0.17"

# Builder pattern
typed-builder = "0.23.2"

# Async streams
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"

# Process utilities
which = "8.0.0"

# Directory utilities (for config paths)
dirs = "6.0.0"

# Tracing (always available - zero cost when no subscriber attached)
tracing = "0.1.44"

# Optional dependencies
schemars = { version = "1.1.0", optional = true }
sha2 = "0.10.9"
base64 = "0.22.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }

[dev-dependencies]
anyhow = "1.0"
tokio-test = "0.4"
tempfile = "3.0"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
chrono = "0.4"

[features]
default = []
rmcp = ["dep:rmcp", "dep:schemars"]

[[test]]
name = "fake_cli"
path = "tests/fake_cli.rs"
harness = false

